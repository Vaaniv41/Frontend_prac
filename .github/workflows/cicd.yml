name: CI/CD

on:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main


jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: run development server
        run: npm run dev

       




  deploy:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: $ {{ secrets.EC2_HOST }}
          username: $ {{ secrets.EC2_USER }}
          key: $ {{ secrets.EC2_KEY }}
          script: |
           
            git pull origin main
            npm install
            npx prisma generate
            npm run test
            npm run build
            npm run dev
            pm2 restart all